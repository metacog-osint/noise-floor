<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L-band RFI Watch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<style>
:root{
  --bg:#0b0e13; --panel:rgba(16,20,27,.92); --line:#263040; --fg:#e7ebf0; --mut:#8b97a8;
  --a:#f5a524; --b:#a78bfa; --ab:#f04438; --pass:#4cc9f0; --ok:#47cd89; --quiet:#667085;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;background:#0d1219}
.leaflet-container{background:#0d1219;font:inherit}
.leaflet-control-attribution{background:rgba(11,14,19,.7)!important;color:var(--mut)!important;font-size:10px}
.leaflet-bottom{bottom:calc(112px + env(safe-area-inset-bottom))}
.leaflet-control-attribution a{color:var(--mut)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#121821;color:var(--fg);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.leaflet-popup-content{margin:12px 14px;min-width:230px;max-width:300px}
.leaflet-popup-close-button{color:var(--mut)!important}

/* header */
#top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:1000;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto}
#title{padding:8px 12px}
#title h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.01em}
#title .sub{color:var(--mut);font-size:12px}
#ctrl{display:flex;gap:6px;padding:6px;flex-wrap:wrap;margin-left:auto}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:999px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:30px}
.chip.on{color:var(--fg);border-color:#3b4a60;background:#1a2230}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
[hidden]{display:none!important}
.clabel{color:#8796ab;font-size:12px;font-weight:650;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 3px #0d1219,0 0 3px #0d1219;pointer-events:none}
.clabel span{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
.emit{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #f5b942;filter:drop-shadow(0 0 2px #000)}
.emit.low{border-bottom-color:#c99a3c;opacity:.75}
.tl{display:block;margin:6px 0 2px}
.tl .ax{stroke:#3b4a60;stroke-width:1}
.tl .on{fill:#e7ecf2}
.tl .off{fill:none;stroke:#8796ab;stroke-width:1.2}
.adsb{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:12.5px}
.adsb button{appearance:none;border:1px solid var(--line);background:#1a2230;color:var(--fg);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
.tag.radar{background:#3a2f12;color:#f5b942;border-color:#5c4a1a}
.exports{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.exports button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.plabel{color:#c9d1dc;font-size:11px;white-space:nowrap;text-shadow:0 0 3px #0d1219,0 0 3px #0d1219,0 0 2px #0d1219;pointer-events:none}
.plabel::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:#c9d1dc;margin-right:4px;vertical-align:middle}
#demo{position:fixed;left:0;right:0;top:0;z-index:1001;background:repeating-linear-gradient(45deg,#3a2a05,#3a2a05 10px,#2c2004 10px,#2c2004 20px);color:#fcd34d;font-size:11.5px;font-weight:650;text-align:center;padding:3px 8px calc(3px);letter-spacing:.03em;display:none}

/* sheet */
#sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:1000;max-width:520px;
  display:flex;flex-direction:column;max-height:58vh;transition:max-height .25s ease}
#sheet.min{max-height:96px}
#grab{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;cursor:pointer;user-select:none}
#grab .h{flex:1}
#grab .big{font-size:14px;font-weight:600}
#grab .small{font-size:12px;color:var(--mut)}
#grab .handle{width:34px;height:4px;border-radius:2px;background:#3a4556;position:absolute;left:50%;top:5px;transform:translateX(-50%)}
#tabs{display:flex;gap:4px;padding:0 10px 8px;border-bottom:1px solid var(--line)}
#tabs button{flex:1;appearance:none;background:transparent;border:0;color:var(--mut);font:inherit;font-size:13px;padding:6px 4px;border-radius:8px;cursor:pointer}
#tabs button.on{color:var(--fg);background:#1a2230}
#list{overflow:auto;padding:4px 0 6px;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(38,48,64,.6);cursor:pointer;align-items:flex-start}
.row:last-child{border-bottom:0}
.row:hover{background:#151c27}
.row .m{flex:1;min-width:0}
.row .t1{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12px;color:var(--mut)}
.row .r{text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--mut)}
.tag.new{color:#fcd34d;border-color:#7a5b0c}
.tag.quiet{color:var(--quiet)}
.tag.active{color:var(--ok);border-color:#1d5c3c}
.empty{padding:16px 12px;color:var(--mut);font-size:13px}
.about{padding:10px 12px 14px;font-size:12.5px;color:#c4ccd7}
.about p{margin:0 0 8px}
.about b{color:var(--fg)}
.lg{display:flex;flex-wrap:wrap;gap:10px 14px;padding:4px 0 8px;font-size:12px;color:var(--mut)}
.lg span{display:inline-flex;gap:6px;align-items:center}

/* popups */
.pp h3{font-size:14px;margin:0 0 2px}
.pp .when{color:var(--mut);font-size:12px;margin-bottom:8px}
.pp table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0}
.pp td{padding:2px 0;vertical-align:top}
.pp td:first-child{color:var(--mut);padding-right:10px;white-space:nowrap}
.pp .int{font-size:12.5px;color:#c4ccd7;margin:6px 0}
.pp a{color:var(--pass)}
.pp .band{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:12.5px}

/* map marks */
.blob{filter:blur(2.2px)}
.lbl{background:transparent;border:0;box-shadow:none;color:#7fd8f5;font-size:10.5px;font-weight:600;text-shadow:0 0 3px #000,0 0 3px #000;padding:0;white-space:nowrap}
.lbl:before{display:none}
.site{width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.site.quiet{border-color:var(--quiet)}
.site.new{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(252,211,77,.85)}100%{box-shadow:0 0 0 16px rgba(252,211,77,0)}}
.sitelbl{background:transparent;border:0;box-shadow:none;color:#fff;font-size:11px;font-weight:700;text-shadow:0 0 3px #000,0 0 4px #000;padding:0}
.sitelbl:before{display:none}
.fix{color:#fff;font-size:20px;line-height:20px;text-align:center;text-shadow:0 0 4px #000;font-weight:300}
.truth{color:#fff;font-size:16px;line-height:16px;text-align:center;text-shadow:0 0 3px #000}
@media (max-width:640px){ .leaflet-control-zoom{display:none} #ctrl{margin-left:0;width:100%} }
@media (prefers-reduced-motion:reduce){ .site.new{animation:none;box-shadow:0 0 0 4px rgba(252,211,77,.6)} #sheet{transition:none} }
</style>
</head>
<body>
<div id="demo">SYNTHETIC TEST DATA — not real detections</div>
<div id="map" role="application" aria-label="Map of L-band interference detections"></div>
<div id="top">
  <div class="card" id="title"><h1 id="t-h">L-band RFI Watch</h1><div class="sub" id="t-sub"></div></div>
  <div class="card" id="ctrl" role="toolbar" aria-label="Filters">
    <button class="chip" data-days="3">3 d</button>
    <button class="chip on" data-days="12">12 d</button>
    <button class="chip" data-days="30">30 d</button>
    <button class="chip" data-days="9999">All</button>
    <button class="chip on" data-band="A" aria-pressed="true"><span class="dot" style="background:var(--a)"></span>A</button>
    <button class="chip on" data-band="B" aria-pressed="true"><span class="dot" style="background:var(--b)"></span>B</button>
    <button class="chip on" data-layer="borders" aria-pressed="true">Borders</button>
    <button class="chip on" data-layer="places" aria-pressed="true">Places</button>
    <button class="chip on" data-layer="passes" aria-pressed="true">Passes</button>
    <button class="chip on" data-layer="emitters" aria-pressed="true">Known radars</button>
    <button class="chip" id="conf-chip" title="Lowest confidence shown">Min: low</button>
    <button class="chip on" id="adsb-chip" hidden aria-pressed="true">ADS-B ×</button>
  </div>
</div>
<div id="sheet" class="card min">
  <div id="grab" role="button" aria-expanded="false" tabindex="0"><span class="handle"></span>
    <div class="h"><div class="big" id="g-big"></div><div class="small" id="g-small"></div></div>
    <span class="small">▴</span></div>
  <div id="tabs" role="tablist">
    <button class="on" data-tab="det">Detections</button><button data-tab="sites">Sites</button>
    <button data-tab="passes">Passes</button><button data-tab="about">About</button>
  </div>
  <div id="list"></div>
</div>
<script>
const DATA = /*__DATA__*/null;
const BANDCOL = {A: getCss('--a'), B: getCss('--b'), AB: getCss('--ab')};
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
// processor RFI score in its own units: max interference-to-signal ratio (tone-rank) in dB, else a fraction in %
function fmtFlag(lk, kind, sep){ return Object.entries(lk || {}).filter(([c, v]) => kind !== 'max_isr' || v > 0)
  .map(([c, v]) => kind === 'max_isr' ? `${c} ${(10 * Math.log10(v)).toFixed(0)} dB` : `${c} ${(v * 100).toFixed(1)}%`).join(sep); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bandKey = b => b.length > 1 ? 'AB' : b[0];
// Stored in UTC; shown in Central time with the zone named.
const CT = new Intl.DateTimeFormat('en-US', {timeZone: 'America/Chicago', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short'});
const fmtT = t => t ? CT.format(new Date(t.length === 16 ? t + ':00Z' : t)) : '';
const gen = new Date(DATA.generated);
let windowDays = 12, bandsOn = new Set(['A', 'B']), tab = 'det';
const PP = {maxWidth: 300, autoPanPaddingTopLeft: L.point(12, 175), autoPanPaddingBottomRight: L.point(12, 125)};

if (DATA.demo) { document.getElementById('demo').style.display = 'block'; document.getElementById('top').style.top = 'calc(26px + env(safe-area-inset-top))'; }
document.getElementById('t-h').textContent = `L-band RFI · ${DATA.aoi.name}`;
document.getElementById('t-sub').textContent = `NISAR L-band · updated ${fmtT(DATA.generated)}`;

const map = L.map('map', {zoomControl: true, attributionControl: true, worldCopyJump: false, preferCanvas: false})
  .setView(DATA.aoi.center, 6);
map.zoomControl.setPosition('topright');
map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
map.createPane('land'); map.getPane('land').style.zIndex = 150;
L.geoJSON(DATA.land, {pane: 'land', interactive: false,
  style: {color: '#2b3646', weight: 1, fillColor: '#1a212c', fillOpacity: 1}}).addTo(map);
// Basemap is Natural Earth land only (public domain): no third-party tile service.
map.attributionControl.addAttribution('NISAR: NASA/JPL-ISRO via ASF DAAC · Natural Earth');
// country borders and place names, each switchable from the filter bar (remembered per browser)
map.createPane('borders'); map.getPane('borders').style.zIndex = 160; map.getPane('borders').style.pointerEvents = 'none';
const layerOn = Object.assign({borders: true, places: true, passes: true, emitters: true, minConf: 1}, (() => { try { return JSON.parse(localStorage.getItem('nf-nisar-layers') || '{}'); } catch (e) { return {}; } })());
const CONF = {LOW: 1, MEDIUM: 2, HIGH: 3}, CONF_NAME = {1: 'low', 2: 'medium', 3: 'high'};
const saveLayers = () => { try { localStorage.setItem('nf-nisar-layers', JSON.stringify(layerOn)); } catch (e) {} };
function kmBetween(a, b, c, d){ const r = Math.PI / 180, h = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 12742 * Math.asin(Math.min(1, Math.sqrt(h))); }
const EMIT = (DATA.emitters && DATA.emitters.list) || [], EMIT_KM = (DATA.emitters && DATA.emitters.flag_km) || 20;
function nearEmitter(lat, lon){ let best = null; EMIT.forEach(e => { const k = kmBetween(lat, lon, e.lat, e.lon); if (k <= EMIT_KM && (!best || k < best.km)) best = {e, km: k}; }); return best; }
const gEmit = L.layerGroup(), gCountry = L.layerGroup(), gAdsb = L.layerGroup().addTo(map);
EMIT.forEach(e => L.marker([e.lat, e.lon], {icon: L.divIcon({className: '', html: `<div class="emit ${e.confidence === 'LOW' ? 'low' : ''}"></div>`, iconSize: [14, 12], iconAnchor: [7, 8]}), title: e.name})
  .bindPopup(`<div class="pp"><h3>${esc(e.name)} · ${esc(e.country)}</h3><div class="when">Known L-band radar: ${esc(e.type)}</div><div class="int">Fixed air-surveillance radar (nominal 1215–1400 MHz, frequency-agile). Detections within ${EMIT_KM} km are flagged as possibly this radar. Position confidence ${esc(e.confidence.toLowerCase())}.</div></div>`, {maxWidth: 300}).addTo(gEmit));
function drawCountries(){
  gCountry.clearLayers();
  const z = map.getZoom();
  if (z > 6.5 || z < 3) return;
  const placed = [];                                  // pixel boxes already used; biggest countries come first
  (DATA.countries || []).forEach(c => {
    const p = map.latLngToContainerPoint([c[1], c[2]]), w = c[0].length * 10 + 8, h = 18;
    const r = [p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2];
    if (placed.some(q => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1])) return;
    placed.push(r);
    L.marker([c[1], c[2]], {interactive: false, keyboard: false,
      icon: L.divIcon({className: 'clabel', html: `<span>${esc(c[0])}</span>`, iconSize: [0, 0], iconAnchor: [0, 0]})}).addTo(gCountry);
  });
}
const gBorders = L.geoJSON(DATA.borders || {type: 'FeatureCollection', features: []}, {pane: 'borders', interactive: false,
  style: f => ({color: '#ffffff', weight: 1.3, opacity: 0.8, dashArray: f.properties && f.properties.d ? '5 4' : null})});   // white reads on the dark basemap
const gPlaces = L.layerGroup();
function drawPlaces(){
  gPlaces.clearLayers();
  const z = map.getZoom(), minPop = z < 5 ? 2e6 : z < 6 ? 7.5e5 : z < 7 ? 3e5 : z < 8 ? 1.2e5 : 0, b = map.getBounds().pad(0.1);
  (DATA.places || []).forEach(p => {
    if ((p[3] || 0) < minPop || !b.contains([p[1], p[2]])) return;
    L.marker([p[1], p[2]], {interactive: false, keyboard: false,
      icon: L.divIcon({className: 'plabel', html: p[0].replace(/[<&>]/g, ''), iconSize: null, iconAnchor: [2, 6]})}).addTo(gPlaces);
  });
}
function applyLayers(){
  layerOn.borders ? gBorders.addTo(map) : gBorders.remove();
  layerOn.places ? gPlaces.addTo(map) : gPlaces.remove();
  layerOn.places ? gCountry.addTo(map) : gCountry.remove();
  layerOn.emitters ? gEmit.addTo(map) : gEmit.remove();
  document.getElementById('conf-chip').textContent = 'Min: ' + CONF_NAME[layerOn.minConf];
  document.getElementById('conf-chip').classList.toggle('on', layerOn.minConf > 1);
  document.querySelectorAll('[data-layer]').forEach(x => { const on = !!layerOn[x.dataset.layer]; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
}
map.on('zoomend moveend', () => { if (layerOn.places) { drawPlaces(); drawCountries(); } });
drawPlaces(); drawCountries(); applyLayers();
document.querySelectorAll('[data-layer]').forEach(b => b.onclick = () => {
  layerOn[b.dataset.layer] = !layerOn[b.dataset.layer]; saveLayers();
  if (layerOn.places) { drawPlaces(); drawCountries(); } applyLayers();
  if (b.dataset.layer === 'passes') draw(); });
document.getElementById('conf-chip').onclick = () => { layerOn.minConf = layerOn.minConf % 3 + 1; saveLayers(); applyLayers(); draw(); };
document.getElementById('adsb-chip').onclick = () => { gAdsb.clearLayers(); document.getElementById('adsb-chip').hidden = true; };

// ADS-B cross-check: aircraft GNSS degradation near a NISAR detection on the pass date, from the public map's day files
const PUB = 'https://noisefloor.theintelligence.company', adsbCache = {};
function adsbCheck(btn){
  const day = btn.dataset.day, lat = +btn.dataset.lat, lon = +btn.dataset.lon, out = btn.parentNode;
  out.innerHTML = 'Checking aircraft data for ' + esc(day) + '…';
  (adsbCache[day] ? Promise.resolve(adsbCache[day]) : fetch(`${PUB}/data/gnss/${day}.json`).then(r => r.ok ? r.json() : null))
    .then(j => {
      adsbCache[day] = j;
      if (!j) { out.innerHTML = `No aircraft data published for ${esc(day)} yet (the public map updates the morning after).`; return; }
      const c = j.cols, ih = c.indexOf('h3'), ia = c.indexOf('aircraft'), ib = c.indexOf('bad_live');
      const near = [];
      j.cells.forEach(x => { const p = h3.cellToLatLng(x[ih]); const k = kmBetween(lat, lon, p[0], p[1]); if (k <= 150) near.push({x, k, n: x[ia], s: x[ia] >= 5 ? 100 * Math.max(x[ib] - 1, 0) / x[ia] : null}); });
      const judged = near.filter(z => z.s !== null), jam = judged.filter(z => z.s >= 10), within50 = judged.filter(z => z.k <= 50);
      const mx = judged.reduce((m, z) => z.s > m.s ? z : m, {s: -1});
      gAdsb.clearLayers();
      near.forEach(z => { if (z.s === null) return;
        const col = z.s >= 25 ? '#ff7a2f' : z.s >= 10 ? '#ffa45c' : z.s >= 2 ? '#ffd1a8' : '#5d6b80';
        L.polygon(h3.cellToBoundary(z.x[ih]), {color: col, weight: .6, fillColor: col, fillOpacity: z.s >= 2 ? .45 : .12, interactive: false}).addTo(gAdsb); });
      document.getElementById('adsb-chip').hidden = !gAdsb.getLayers().length;
      const link = `<a href="${PUB}/map#day=${esc(day)}&m=jam&v=${lat.toFixed(2)},${lon.toFixed(2)},7" target="_blank" rel="noopener">Open the public map ↗</a>`;
      if (!judged.length) { out.innerHTML = `<b>${esc(day)}:</b> no hex within 150 km had 5 or more aircraft, so ADS-B can't say anything here. ${link}`; return; }
      out.innerHTML = `<b>${esc(day)}:</b> ${jam.length} of ${judged.length} hexes within 150 km at jamming scale (10%+ of aircraft degraded)` +
        (within50.length ? `; within 50 km ${within50.filter(z => z.s >= 10).length} of ${within50.length}` : '') +
        (mx.s >= 0 ? `; worst ${mx.s.toFixed(0)}% at ${mx.k.toFixed(0)} km` : '') +
        `. Daily totals, not the pass time. ${link}`;
    }).catch(() => { out.innerHTML = 'Could not read the public aircraft data.'; });
}
const adsbBlock = (day, lat, lon) => `<div class="adsb"><button class="adsb-btn" data-day="${esc(day)}" data-lat="${lat}" data-lon="${lon}">Check aircraft GNSS on ${esc(day)}</button></div>`;
map.on('popupopen', e => { const el = e.popup.getElement(); if (el) el.querySelectorAll('.adsb-btn').forEach(b => b.onclick = () => adsbCheck(b)); });

// site timeline: every pass that covered the site, filled when it detected
function siteTimeline(s){
  const cov = (s.coverage || []).slice().sort((a, b) => a.start < b.start ? -1 : 1);
  if (!cov.length) return '';
  const t0 = new Date(cov[0].start), t1 = new Date(cov[cov.length - 1].start), span = Math.max(1, t1 - t0), W = 260, H = 26;
  const x = t => 8 + (W - 16) * ((new Date(t) - t0) / span);
  const marks = cov.map(c => c.active ? `<circle class="on" cx="${x(c.start).toFixed(1)}" cy="13" r="3.6"><title>${esc(fmtT(c.start))}: detected</title></circle>`
                                      : `<circle class="off" cx="${x(c.start).toFixed(1)}" cy="13" r="3.2"><title>${esc(fmtT(c.start))}: covered, nothing</title></circle>`).join('');
  return `<svg class="tl" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Passes over this site"><line class="ax" x1="8" x2="${W - 8}" y1="13" y2="13"/>${marks}</svg>
    <div class="when" style="margin:0">${esc(fmtT(cov[0].start))} → ${esc(fmtT(cov[cov.length - 1].start))} · filled = detected, hollow = covered with nothing</div>`;
}

// exports of what the map holds (private: they stay with you)
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportSitesCsv(){
  const rows = [['id', 'lat', 'lon', 'status', 'first_seen_utc', 'last_seen_utc', 'active_passes', 'covering_passes', 'bands', 'fix_lat', 'fix_lon', 'fix_err_km', 'where', 'near_known_radar']];
  DATA.sites.forEach(s => { const cov = s.coverage || [], ne = nearEmitter(s.lat, s.lon);
    rows.push([s.id, s.lat, s.lon, s.status, s.first_seen, s.last_seen, cov.filter(c => c.active).length, cov.length, (s.bands_seen || []).join('+'),
      s.fix ? s.fix.lat : '', s.fix ? s.fix.lon : '', s.fix ? s.fix.error_km : '', s.where || '', ne ? `${ne.e.name} (${ne.km.toFixed(0)} km)` : '']); });
  download('nisar-sites.csv', rows.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv');
}
function exportDetsCsv(){
  const rows = [['id', 'start_utc', 'lat', 'lon', 'bands', 'confidence', 'method', 'track', 'direction', 'frame', 'site', 'where', 'near_known_radar']];
  DATA.detections.forEach(d => { const ne = nearEmitter(d.lat, d.lon);
    rows.push([d.id, d.start, d.lat, d.lon, d.bands.join('+'), d.confidence, d.method || 'image', d.track, d.direction, d.frame, d.site || '', d.where || '', ne ? `${ne.e.name} (${ne.km.toFixed(0)} km)` : '']); });
  download('nisar-detections.csv', rows.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv');
}
function exportKml(){
  const pm = (name, desc, lat, lon) => `<Placemark><name>${esc(name)}</name><description>${esc(desc)}</description><Point><coordinates>${lon},${lat},0</coordinates></Point></Placemark>`;
  const sites = DATA.sites.map(s => pm(s.id, `${s.status}; ${(s.coverage || []).filter(c => c.active).length}/${(s.coverage || []).length} passes; bands ${(s.bands_seen || []).join('+')}; last ${s.last_seen}`, s.lat, s.lon)).join('');
  const dets = DATA.detections.map(d => pm(`${d.start.slice(0, 16)}Z ${d.bands.join('+')}`, `${d.confidence}; ${d.method || 'image'}; site ${d.site || ''}`, d.lat, d.lon)).join('');
  download('nisar-watch.kml', `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>NISAR L-band watch</name><Folder><name>Sites</name>${sites}</Folder><Folder><name>Detections</name>${dets}</Folder></Document></kml>`, 'application/vnd.google-earth.kml+xml');
}
L.geoJSON(DATA.aoi.geojson, {interactive: false, style: {color: '#5b6b82', weight: 1, dashArray: '2 6', fill: false}}).addTo(map);

const gPass = L.layerGroup().addTo(map), gDet = L.layerGroup().addTo(map), gSite = L.layerGroup().addTo(map),
      gFix = L.layerGroup().addTo(map), gTruth = L.layerGroup().addTo(map);
const detLayers = {}, siteLayers = {};

function inWindow(t){ return (gen - new Date(t)) / 864e5 <= windowDays; }
function detVisible(d){ return inWindow(d.start) && d.bands.some(b => bandsOn.has(b)) && (CONF[d.confidence] || 1) >= (layerOn.minConf || 1); }

function detPopup(d){
  const k = bandKey(d.bands);
  const lk = fmtFlag(d.rfi_likelihood, d.rfi_kind, ', ') || 'n/a';
  return `<div class="pp"><h3>${esc(d.where || (d.lat + ', ' + d.lon))}</h3>
  <div class="when">${esc(fmtT(d.start))} · track ${d.track} ${d.direction === 'A' ? 'ascending' : 'descending'} · frame ${d.frame}</div>
  <div class="band"><span class="dot" style="background:${BANDCOL[k]}"></span>${esc(d.band_text)}</div>
  ${d.gnss_overlap.length ? `<div class="when" style="margin:2px 0 0">In band: ${esc(d.gnss_overlap.join(', '))}</div>` : ''}
  <div class="int">${esc(d.interpretation)}</div>
  <table>
    ${d.method === 'broadband' ? `
    <tr><td>HV/HH excess</td><td>${d.peak_ratio_excess_db} dB over the ground's ratio · z ${d.peak_bb_z} · ${esc(d.confidence.toLowerCase())} confidence</td></tr>
    <tr><td>Excess power</td><td>${d.peak_excess_power_db} dB over the frame (broadband, no frequency detail)</td></tr>
    <tr><td>Extent</td><td>${d.along_km} km along track × ${d.across_km} km across · ${d.blocks} blocks${d.widespread ? ' · widespread' : ''}</td></tr>
    ` : d.method === 'tables' ? `
    <tr><td>Pulses hit</td><td>${Math.round(d.peak_hit * 100)}% · ${esc((d.pols || []).join('+'))} · ${esc(d.confidence.toLowerCase())} confidence</td></tr>
    <tr><td>Interference</td><td>interference-to-signal ${d.peak_isr_db} dB (processor table)</td></tr>
    <tr><td>Extent</td><td>${d.along_km} km along track × ${d.across_km} km across · ${d.blocks} blocks${d.widespread ? ' · widespread' : ''}</td></tr>
    ${d.broadband ? `<tr><td>Broadband</td><td>HV/HH +${d.broadband.peak_ratio_excess_db} dB nearby</td></tr>` : ''}
    ` : `
    <tr><td>Cross-pol excess</td><td>peak ${d.peak_excess_db} dB · mean ${d.mean_excess_db} dB</td></tr>
    <tr><td>Anomaly</td><td>peak z ${d.peak_z} · ${esc(d.confidence.toLowerCase())} confidence</td></tr>
    <tr><td>Extent</td><td>${d.length_km} × ${d.width_km} km · ${d.area_km2} km²</td></tr>
    <tr><td>Shape</td><td>${d.aligned_with_range ? 'streak along range (RFI-like)' : 'not range-aligned'}</td></tr>
    `}
    <tr><td>Processor flag</td><td>${esc(lk)}</td></tr>
    <tr><td>Site</td><td>${esc(d.site || '')}${d.ignored ? ' · ignored: ' + esc(d.ignored) : ''}</td></tr>
    ${(n => n ? `<tr><td>Known radar</td><td>${esc(n.e.name)}, ${esc(n.e.type)}, ${n.km.toFixed(0)} km away: may be this radar</td></tr>` : '')(nearEmitter(d.lat, d.lon))}
  </table>
  ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">Granule in Vertex ↗</a>` : ''}
  ${adsbBlock(d.start.slice(0, 10), d.lat, d.lon)}</div>`;
}

function sitePopup(s){
  const cov = s.coverage || [], act = cov.filter(c => c.active).length;
  return `<div class="pp"><h3>${esc(s.id)} · ${esc(s.where || '')}</h3>
  <div class="when">first ${fmtT(s.first_seen)} · last ${fmtT(s.last_seen)}</div>
  <table>
    <tr><td>Status</td><td>${esc(s.status)}${s.ignored ? ' (ignored: ' + esc(s.ignored) + ')' : ''}</td></tr>
    <tr><td>Active passes</td><td>${act} of ${cov.length} that covered it</td></tr>
    <tr><td>Bands seen</td><td>${esc(s.bands_seen.join(', '))}</td></tr>
    <tr><td>Geometries</td><td>${esc(s.geometries.join(', '))}</td></tr>
    <tr><td>Cross-fix</td><td>${s.fix ? `${s.fix.lat}, ${s.fix.lon} ± ${s.fix.error_km} km (${s.fix.crossing_deg}° crossing)` : 'needs two crossing geometries'}</td></tr>
    ${(n => n ? `<tr><td>Known radar</td><td>${esc(n.e.name)}, ${n.km.toFixed(0)} km away: may be this radar</td></tr>` : '')(nearEmitter(s.lat, s.lon))}
  </table>${siteTimeline(s)}
  ${(() => { const last = (s.coverage || []).filter(c => c.active).map(c => c.start).sort().pop() || s.last_seen; return adsbBlock(last.slice(0, 10), s.lat, s.lon); })()}</div>`;
}

function draw(){
  [gPass, gDet, gSite, gFix, gTruth].forEach(g => g.clearLayers());
  for (const k in detLayers) delete detLayers[k];
  const showLabels = map.getZoom() >= 6;
  // passes, newest on top
  const passes = DATA.passes.filter(p => inWindow(p.start)).sort((a, b) => a.start < b.start ? -1 : 1);
  if (layerOn.passes) passes.forEach(p => {
    const age = (gen - new Date(p.start)) / 864e5, op = Math.max(.25, 1 - age / Math.max(windowDays, 1));
    const poly = L.polygon(p.footprint.map(([x, y]) => [y, x]), {color: getCss('--pass'), weight: 1, opacity: op * .8,
      dashArray: '4 4', fillColor: getCss('--pass'), fillOpacity: .025, interactive: false}).addTo(gPass);
    if (showLabels && windowDays <= 30) {
      const top = p.footprint.reduce((a, b) => b[1] > a[1] ? b : a);       // label the frame's northern corner
      L.tooltip({permanent: true, direction: 'top', className: 'lbl', opacity: op, offset: [0, -2]})
        .setLatLng([top[1], top[0]]).setContent(`${esc(fmtT(p.start))} ${p.direction}`).addTo(gPass);
    }
  });
  DATA.detections.filter(detVisible).sort((a, b) => a.start < b.start ? -1 : 1).forEach(d => {
    const k = bandKey(d.bands), col = BANDCOL[k];
    const op = {HIGH: .6, MEDIUM: .45, LOW: .25}[d.confidence] ?? .3;
    if (d.method === 'tables' || d.method === 'broadband') {
      // table detections: the box is the extent of hot blocks (can be 100+ km), the dot is the located position
      L.polygon(d.outline.map(([x, y]) => [y, x]), {color: col, weight: .8, opacity: .35, dashArray: '2 4', fill: false,
        interactive: false}).addTo(gDet);
      const mk = L.circleMarker([d.lat, d.lon], {radius: {HIGH: 7, MEDIUM: 5.5, LOW: 4}[d.confidence] ?? 5,
        color: d.method === 'broadband' ? '#fff' : '#0b0d10', weight: d.method === 'broadband' ? 1.5 : 1,
        fillColor: col, fillOpacity: Math.min(.95, op + .35), dashArray: d.confidence === 'LOW' ? '2 2' : null})
        .addTo(gDet).bindPopup(detPopup(d), PP);
      detLayers[d.id] = mk;
      return;
    }
    const glow = L.polygon(d.outline.map(([x, y]) => [y, x]), {stroke: false, fillColor: col, fillOpacity: op, className: 'blob', interactive: false}).addTo(gDet);
    const edge = L.polygon(d.outline.map(([x, y]) => [y, x]), {color: col, weight: 1.2, opacity: .9, fill: true, fillOpacity: .01,
      dashArray: d.confidence === 'LOW' ? '3 3' : null}).addTo(gDet).bindPopup(detPopup(d), PP);
    detLayers[d.id] = edge;
  });
  DATA.sites.forEach(s => {
    const vis = s.detections_meta.some(d => inWindow(d.start) && d.bands.some(b => bandsOn.has(b)));
    if (!vis) return;
    const isNew = (gen - new Date(s.first_seen)) / 864e5 <= 3 && !s.baseline;
    const icon = L.divIcon({className: '', html: `<div class="site ${s.status === 'QUIET' ? 'quiet' : ''} ${isNew ? 'new' : ''}"></div>`, iconSize: [16, 16], iconAnchor: [8, 8]});
    const m = L.marker([s.lat, s.lon], {icon, keyboard: true, title: s.id}).addTo(gSite).bindPopup(sitePopup(s), PP);
    if (showLabels) m.bindTooltip(s.id, {permanent: true, direction: 'right', offset: [10, 0], className: 'sitelbl'});
    siteLayers[s.id] = m;
    if (s.fix) {
      L.circle([s.fix.lat, s.fix.lon], {radius: s.fix.error_km * 1000, color: '#fff', weight: 1, dashArray: '3 4', fill: false, interactive: false}).addTo(gFix);
      L.marker([s.fix.lat, s.fix.lon], {icon: L.divIcon({className: '', html: '<div class="fix">⌖</div>', iconSize: [20, 20], iconAnchor: [10, 10]})})
        .addTo(gFix).bindPopup(`<div class="pp"><h3>Cross-fix · ${esc(s.id)}</h3><div class="when">${s.fix.lat}, ${s.fix.lon} ± ${s.fix.error_km} km</div><div class="int">Intersection of streak axes from two viewing geometries crossing at ${s.fix.crossing_deg}°.</div></div>`, PP);
    }
  });
  (DATA.truth || []).forEach(t => L.marker([t.lat, t.lon], {icon: L.divIcon({className: '', html: '<div class="truth">✕</div>', iconSize: [16, 16], iconAnchor: [8, 8]})})
    .addTo(gTruth).bindPopup(`<div class="pp"><h3>Test emitter (truth)</h3><div class="when">${esc(t.label)}</div></div>`, PP));
  renderSheet();
}

function renderSheet(){
  const dets = DATA.detections.filter(detVisible).sort((a, b) => a.start < b.start ? 1 : -1);
  const sites = DATA.sites.filter(s => s.detections_meta.some(d => inWindow(d.start)));
  const newSites = sites.filter(s => (gen - new Date(s.first_seen)) / 864e5 <= 3 && !s.baseline);
  const passes = DATA.passes.filter(p => inWindow(p.start));
  document.getElementById('g-big').textContent =
    `${dets.length} detection${dets.length === 1 ? '' : 's'} · ${sites.filter(s => s.status === 'ACTIVE').length} active site${sites.length === 1 ? '' : 's'}` + (newSites.length ? ` · ${newSites.length} new` : '');
  document.getElementById('g-small').textContent = `${passes.length} passes imaged in the last ${windowDays >= 9999 ? 'archive' : windowDays + ' days'}`;
  const L_ = document.getElementById('list');
  if (tab === 'det') {
    L_.innerHTML = `<div class="lg" style="padding:6px 12px 2px"><span><span class="dot" style="background:var(--a)"></span>A only</span><span><span class="dot" style="background:var(--b)"></span>B only</span><span><span class="dot" style="background:var(--ab)"></span>A + B</span></div>` +
      (dets.map(d => `<div class="row" data-det="${d.id}"><span class="dot" style="margin-top:5px;background:${BANDCOL[bandKey(d.bands)]}"></span>
      <div class="m"><div class="t1">${esc(d.where || d.lat + ', ' + d.lon)}</div><div class="t2">${esc(d.band_text)}${d.gnss_overlap.length ? ' · ' + esc(d.gnss_overlap.join(', ')) : ''}</div></div>
      <div class="r">${fmtT(d.start)}<br><span class="tag">${esc(d.confidence)}</span>${nearEmitter(d.lat, d.lon) ? ' <span class="tag radar">radar?</span>' : ''}</div></div>`).join('') || '<div class="empty">Nothing in this window.</div>');
  } else if (tab === 'sites') {
    L_.innerHTML = sites.sort((a, b) => a.last_seen < b.last_seen ? 1 : -1).map(s => {
      const isNew = newSites.includes(s), cov = s.coverage || [];
      return `<div class="row" data-site="${s.id}"><div class="m"><div class="t1">${esc(s.id)} · ${esc(s.where || '')}</div>
      <div class="t2">${cov.filter(c => c.active).length}/${cov.length} passes active · bands ${esc(s.bands_seen.join('+'))}${s.fix ? ' · fixed ±' + s.fix.error_km + ' km' : ''}</div></div>
      <div class="r">${fmtT(s.last_seen)}<br>${isNew ? '<span class="tag new">NEW</span>' : `<span class="tag ${s.status === 'QUIET' ? 'quiet' : 'active'}">${esc(s.status)}</span>`}</div></div>`;
    }).join('') || '<div class="empty">No sites in this window.</div>';
  } else if (tab === 'passes') {
    L_.innerHTML = passes.sort((a, b) => a.start < b.start ? 1 : -1).map(p => {
      const lk = fmtFlag(p.rfi_likelihood, p.rfi_kind, ' ');
      return `<div class="row" data-pass="${esc(p.granule)}"><div class="m"><div class="t1">T${p.track} ${p.direction === 'A' ? 'asc' : 'desc'} · frame ${p.frame}</div>
      <div class="t2">${esc(p.mode || '')} MHz · processor flag ${esc(lk || 'n/a')}${p.status === 'error' ? ' · <b style="color:var(--ab)">error</b>' : ''}</div></div>
      <div class="r">${fmtT(p.start)}<br>${p.detections ? `<span class="tag active">${p.detections} det</span>` : '<span class="tag">clean</span>'}</div></div>`;
    }).join('') || '<div class="empty">No passes in this window.</div>';
  } else {
    L_.innerHTML = `<div class="about">
      <p><b>What this shows.</b> Places where NISAR's L-band radar picked up emissions inside its own receive band. Frequency A covers ${esc(DATA.band_text.A || '')}; frequency B covers ${esc(DATA.band_text.B || '')}.</p>
      <p><b>How.</b> Unpolarized interference raises cross-pol (HV) relative to co-pol (HH) far beyond what the ground itself produces. Each pass is scored against its own scene, smoothed along the radar range direction (interference streaks run cross-track), and grouped into sites across passes.</p>
      <p><b>Reading it.</b> Blob = one pass. Ring = site (pulsing = first seen in the last 3 days, grey = quiet on recent passes). ⌖ = cross-fix from two crossing geometries. Dashed outlines = imaged frames, labelled with acquisition time.</p>
      <p><b>Limits.</b> Snapshots, not continuous: each spot is imaged every few days. Locations are blob-level. Jammers that only cover GPS L1 do not appear. Products are processed with an RFI filter, which can weaken weak signatures. These are leads for triage, not findings.</p>
      <p><b>Tools.</b> ▲ = known L-band air-surveillance radar (private list); detections within ${EMIT_KM} km are tagged "radar?". Click a site for its pass timeline. "Check aircraft GNSS" reads the public ADS-B map for the pass date and draws the hexes within 150 km (daily totals, not the pass time).</p>
      <div class="exports"><button id="x-sites">Sites (CSV)</button><button id="x-dets">Detections (CSV)</button><button id="x-kml">Sites and detections (KML)</button></div>
      <p class="sub" style="color:var(--mut)">${esc(DATA.footer || '')}</p></div>`;
    document.getElementById('x-sites').onclick = exportSitesCsv;
    document.getElementById('x-dets').onclick = exportDetsCsv;
    document.getElementById('x-kml').onclick = exportKml;
  }
  const focus = () => { document.getElementById('sheet').classList.add('min'); grab.setAttribute('aria-expanded', 'false'); };
  L_.querySelectorAll('[data-det]').forEach(r => r.onclick = () => { const l = detLayers[r.dataset.det]; if (l) { focus(); if (l.getLatLng) map.setView(l.getLatLng(), 8); else map.fitBounds(l.getBounds(), {maxZoom: 9, paddingTopLeft: [16, 170], paddingBottomRight: [16, 120]}); setTimeout(() => l.openPopup(), 350); } });
  L_.querySelectorAll('[data-site]').forEach(r => r.onclick = () => { const m = siteLayers[r.dataset.site]; if (m) { focus(); map.setView(m.getLatLng(), 9); setTimeout(() => m.openPopup(), 350); } });
  L_.querySelectorAll('[data-pass]').forEach(r => r.onclick = () => { const p = DATA.passes.find(x => x.granule === r.dataset.pass); if (p) { focus(); map.fitBounds(p.footprint.map(([x, y]) => [y, x]), {paddingTopLeft: [16, 170], paddingBottomRight: [16, 120]}); } });
}

document.querySelectorAll('[data-days]').forEach(b => b.onclick = () => {
  windowDays = +b.dataset.days; document.querySelectorAll('[data-days]').forEach(x => x.classList.toggle('on', x === b)); draw(); });
document.querySelectorAll('[data-band]').forEach(b => b.onclick = () => {
  const k = b.dataset.band; bandsOn.has(k) ? bandsOn.delete(k) : bandsOn.add(k);
  b.classList.toggle('on', bandsOn.has(k)); b.setAttribute('aria-pressed', bandsOn.has(k)); draw(); });
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('sheet').classList.remove('min'); document.getElementById('grab').setAttribute('aria-expanded', 'true'); renderSheet(); });
const grab = document.getElementById('grab');
const toggleSheet = () => { const s = document.getElementById('sheet'); s.classList.toggle('min'); grab.setAttribute('aria-expanded', !s.classList.contains('min')); };
grab.onclick = toggleSheet; grab.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSheet(); } };
let lastZ = map.getZoom(); map.on('zoomend', () => { const z = map.getZoom(); if ((z >= 6) !== (lastZ >= 6)) draw(); lastZ = z; });
draw();
{ // open on the watch area; fall back to the detections when there is no area outline
  let b = DATA.aoi && DATA.aoi.geojson ? L.geoJSON(DATA.aoi.geojson).getBounds() : null;
  if (!b || !b.isValid()) b = L.latLngBounds(DATA.detections.filter(detVisible).map(d => [d.lat, d.lon])).pad(0.2);
  if (b.isValid()) map.fitBounds(b, {maxZoom: 8, paddingTopLeft: [16, 150], paddingBottomRight: [16, 130], animate: false});
}
</script>
</body>
</html>
