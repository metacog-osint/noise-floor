name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements.txt\nnisar/requirements.txt" }
      - run: pip install -r requirements.txt -r nisar/requirements.txt
      - name: Public-repo guard (private term list from the FORBIDDEN_TERMS secret; fails closed without it)
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: python tools/check_public.py --all
      - name: Licence registry
        run: python tools/check_registry.py
      - name: Public site matches site_src and the registry
        run: python tools/build_site.py && git diff --exit-code -- site
      - name: Offline tests
        run: for t in tests/test_*.py; do python "$t" || exit 1; done
