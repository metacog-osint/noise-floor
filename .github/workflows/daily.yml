name: daily
# Phase 2: process each new adsb.lol day (pipeline/daily_job.py), publish the outputs as assets on this repo's
# release pnt-data-YYYY-MM (ODbL 1.0), then redeploy the site so the map shows the day.
# --position-loss adds <day>.loss.parquet and <day>.loss_daily.parquet (docs/validation/position-loss.md); reanalyse runs
# ignore it.
# adsb.lol publishes day D at about 03:30 UTC on D+1. Each run checks the last 7 days and fills any gap.
# Starts: tic-dispatch (The Intelligence Company's dispatch Worker) starts this through workflow_dispatch at :25 past
# 04-07 UTC (from 17 Nov 2026), because GitHub's own cron fires 4-9 hours late on this account (the 12:40 cron ran at
# 12:10-14:19 on 7-16 Nov, the 05:40 one never on time). A start with no new day exits in a few minutes. The crons
# below are the fallback. (The GEO steps left on 18 Nov 2026 with the GEO page, now Orbit's.)
on:
  schedule:
    - cron: "40 5 * * *"     # 05:40 UTC = 00:40 CDT / 23:40 CST
    - cron: "40 12 * * *"    # second look, for a late adsb.lol release (exits in about a minute if nothing is new)
  workflow_dispatch:
    inputs:
      days:
        description: "Days to process: YYYY-MM-DD or START:END, space-separated. Empty = the latest missing days."
        required: false
        default: ""
      force:
        description: "Redo days that are already published"
        type: boolean
        default: false
      reanalyse:
        description: "Rerun only the analyses on published days (no adsb.lol download)"
        type: boolean
        default: false
permissions:
  contents: write    # create the monthly data releases and upload assets
  actions: read      # the deploy job looks up the newest commit that passed CI
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      changed: ${{ steps.run.outputs.changed }}
      tests_changed: ${{ steps.tests.outputs.tests_changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Process and publish new days
        id: run
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          REANALYSE: ${{ inputs.reanalyse && '--reanalyse' || '' }}
        run: python pipeline/daily_job.py $DAYS $FORCE $REANALYSE --position-loss --spoofing
      # declared events: announced US GPS interference tests from the FAA's public flight advisories
      - name: Announced GPS tests
        id: tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/declared
          gh release download declared-data -p faa_gps_tests.json -D data/declared --clobber
          python pipeline/faa_gps_tests.py --rss
          gh release upload declared-data data/declared/faa_gps_tests.json --clobber
      # GPS/GNSS NOTAMs: Launch's day files (read through the FAA NMS-API), kept beyond Launch's 14 days
      - name: GNSS NOTAMs
        id: notams
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/gnss_notams.py archive --upload
      # Private archive: what this run wrote also goes to the PRIVATE repo metacog-osint/tic-archive
      # (tools/tic_archive.py; release noisefloor-<lane>-YYYY-MM, a snapshot per run, only new content uploaded,
      # nothing replaced or deleted). The public releases stay as they are; this is a second copy that keeps every
      # version. data/ is not in git, so each folder holds only what this run wrote or read.
      #   pnt       data/pnt: the day files this run published to pnt-data-YYYY-MM (a forced rerun, --reanalyse or
      #             --spoof-only replaces them there), a day whose upload failed among them, and the earlier days it
      #             read for the baselines. Empty when no day was processed.
      #   declared  data/declared: faa_gps_tests.json and the GNSS NOTAM files, which declared-data replaces.
      # The steps above stop at their own limits, inside the job's, so a run that runs out of time still gets here.
      # Each lane is tried even if the other failed; a missing token or a failed put turns the run red.
      - name: Private archive (this run's PNT and declared files, to tic-archive)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
        run: |
          has() { [ -n "$(find "$1" -type f -print -quit 2>/dev/null)" ]; }
          if ! has data/pnt && ! has data/declared; then
            echo "no PNT or declared file this run, so nothing was archived"; exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so this run's files did not reach the private archive"; exit 1
          fi
          failed=0
          if has data/pnt; then
            python tools/tic_archive.py put --program noisefloor --lane pnt --src data/pnt || failed=1
          else
            echo "pnt: no day was processed this run, so nothing was archived"
          fi
          if has data/declared; then
            python tools/tic_archive.py put --program noisefloor --lane declared --src data/declared || failed=1
          else
            echo "declared: no declared file this run, so nothing was archived"
          fi
          if [ "$failed" != 0 ]; then
            echo "::error::a lane did not reach the private archive this run (see above)"; exit 1
          fi
  deploy:
    needs: process
    if: ${{ !cancelled() && (needs.process.outputs.changed == 'true' || needs.process.outputs.tests_changed == 'true') }}
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
