name: milair
# Military air day job (tools/milair_job.py): military aircraft seen on ADS-B and MLAT per region and role, from the
# adsb.lol daily archive (ODbL), streamed from its public release links without saving it -> <day>.milair.json on
# the release milair-data-YYYY. Aggregates only, no aircraft identifiers. Every count is a lower bound. Method:
# docs/validation/milair.md. The site's deploy reads the files (tools/milair.py site) and feed_v2.py adds one routine
# item per region; nothing here is an alert.
# adsb.lol posts day D's archive about 03:25 UTC on D+1. GitHub's cron fires hours late on this account, so these
# starts land through the morning; a start with no days given makes any of the last three days still missing, so an
# extra start costs about a minute. Backfill: Run workflow with days START:END (about 4 min a day on GitHub).
on:
  schedule:
    - cron: "45 4 * * *"
    - cron: "45 8 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days: YYYY-MM-DD or START:END, space-separated. Empty = any of the last three days not yet made."
        required: false
        default: ""
      force:
        description: "Remake days already in the release"
        type: boolean
        default: false
permissions:
  contents: write    # create the yearly milair-data release and upload assets
concurrency:
  group: milair
  cancel-in-progress: false
jobs:
  day:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The step stops at its own limit, before the job's, so a long backfill that runs out of time still reaches the
      # private archive step below with the day files it made (a step that times out fails; it is not cancelled).
      - name: Military air day files
        id: days
        timeout-minutes: 320
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python tools/milair_job.py $DAYS $FORCE
      # Private archive: every day file this run made also goes to the PRIVATE repo metacog-osint/tic-archive
      # (tools/tic_archive.py, lane milair: release noisefloor-milair-YYYY-MM, one snapshot per run that made a file,
      # only new content uploaded, nothing replaced or deleted). The public release holds one copy of each day, which
      # a forced remake replaces (--clobber); the archive keeps every version. data/ is not in git, so data/milair
      # holds only the files this run wrote, a day whose public upload failed among them. A run that made no file
      # archives nothing; a missing token or a failed put turns the run red.
      - name: Private archive (day files made this run, to tic-archive)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
        run: |
          if ! ls data/milair/*.milair.json > /dev/null 2>&1; then
            echo "milair: this run made no day file, so nothing was archived"; exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so this run's day files did not reach the private archive"; exit 1
          fi
          python tools/tic_archive.py put --program noisefloor --lane milair --src data/milair
