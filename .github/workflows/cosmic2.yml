name: cosmic2
# COSMIC-2 day job (tools/cosmic2_job.py). One pass over UCAR's podTc2 day archive (about 450-650 MB, nothing kept) makes
#   <day>.cosmic2-limb-s4.json -> release swx-data-YYYY-MM: limb S4 measured along radio-occultation paths, which reads
#                                 higher than a ground receiver's S4 (tools/cosmic2_s4.py, docs/validation/cosmic2-limb-s4.md)
#   <day>.cosmic2.json         -> release cosmic2-data (the interference layer), only if that release lacks the day; this
#                                 PC's own run (tools/cosmic2_daily.py) still makes it while this path is proven
# UCAR posts day D at about 04:35 UTC on D+1. The limb S4 file is due by 14:00 UTC on D+1: a same-morning picture for the
# board and COP.
# Starts: tic-dispatch (The Intelligence Company's dispatch Worker) starts this through workflow_dispatch at :50 past
# 04-08 and 10-13 UTC (from 15 Nov 2026), because GitHub's own cron fires 4-9 hours late on this account (measured 5 Nov 2026; the
# 05:15 cron fired at 12:41 on 15 Nov). The crons below are the fallback, set early so that a late start still lands
# between UCAR's posting and 14:00 UTC. The gate (the day's limb S4 file already in its release) makes extra starts end
# in about a minute, so the day is made once. Runs that find UCAR late wait up to 45 minutes, then leave it to the next
# start; from 13:00 UTC a missing archive fails the run, so GitHub mails the owner.
on:
  schedule:
    - cron: "15 1 * * *"
    - cron: "15 3 * * *"
    - cron: "15 5 * * *"
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days: YYYY-MM-DD or START:END, space-separated. Empty = yesterday (UTC)."
        required: false
        default: ""
      force:
        description: "Redo days whose limb S4 file is already published"
        type: boolean
        default: false
      s4_only:
        description: "Only the limb S4 file (skip the interference day file)"
        type: boolean
        default: false
permissions:
  contents: write    # create the monthly swx-data release and upload assets
concurrency:
  group: cosmic2
  cancel-in-progress: false
jobs:
  day:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # scipy reads the netCDF link files; shapely and pyproj name places in the interference file (nisar_rfi.places)
      - run: pip install -r requirements.txt scipy shapely pyproj
      # The step stops at its own limit, inside the job's, so a run that runs out of time still reaches the private
      # archive step below with the files it made (a step that times out fails; it is not cancelled).
      - name: COSMIC-2 day files
        timeout-minutes: 320
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          S4_ONLY: ${{ inputs.s4_only && '--s4-only' || '' }}
        run: python tools/cosmic2_job.py $DAYS $FORCE $S4_ONLY --wait-minutes 45 --deadline-hour 13
      # Private archive: the day files this run wrote also go to the PRIVATE repo metacog-osint/tic-archive
      # (tools/tic_archive.py, lane limbs4: release noisefloor-limbs4-YYYY-MM, a snapshot per run that made a file,
      # only new content uploaded, nothing replaced or deleted): the limb S4 files (data/swx, for swx-data-YYYY-MM)
      # and the interference files (data/cosmic2/daily, for cosmic2-data), which a forced remake replaces there.
      # Not the UCAR link files the job read (data/cosmic2/days), which UCAR keeps. data/ is not in git, so the
      # folders hold only this run's files. A missing token or a failed put turns the run red.
      - name: Private archive (day files made this run, to tic-archive)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
        run: |
          mkdir -p data/swx data/cosmic2/daily
          if [ -z "$(find data/swx data/cosmic2/daily -type f -name '*.json' -print -quit)" ]; then
            echo "limbs4: this run made no day file, so nothing was archived"; exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so this run's day files did not reach the private archive"; exit 1
          fi
          python tools/tic_archive.py put --program noisefloor --lane limbs4 --src swx=data/swx \
            --src cosmic2=data/cosmic2/daily --exclude 'swx/raw/*'
