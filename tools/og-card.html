<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Noisefloor link preview card</title>
<!-- Source for site_src/og-card.png (1200x630): the picture LinkedIn, Slack, Signal and others show when a Noisefloor
     link is pasted. Site fonts and colours. Not deployed; build_site.py copies the PNG into site/.
     To regenerate, from the project root:
       python -m http.server 5057 --bind 127.0.0.1
       msedge --headless=new --disable-gpu --hide-scrollbars --user-data-dir=%TEMP%\edge-og --window-size=1200,630
         --virtual-time-budget=5000 --screenshot=<project>\site_src\og-card.png http://127.0.0.1:5057/tools/og-card.html
     LinkedIn caches previews; its Post Inspector refreshes one. -->
<style>
@font-face { font-family: "IBM Plex Sans"; font-weight: 400 600; src: url("../site_src/fonts/ibm-plex-sans-latin.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../site_src/fonts/ibm-plex-mono-500-latin.woff2") format("woff2"); }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #f5f6f8; color: #141a23; }
.card { box-sizing: border-box; height: 630px; padding: 60px 80px 58px; display: flex; flex-direction: column; }
.mast { display: flex; align-items: center; gap: 22px; padding-bottom: 26px; border-bottom: 3px solid #141a23;
  font: 600 44px/1.1 "IBM Plex Sans", "Segoe UI", sans-serif; }
.mast small { display: block; font: 500 20px/1.3 "IBM Plex Mono", Consolas, monospace; letter-spacing: .06em;
  text-transform: uppercase; color: #626b78; margin-top: 6px; }
h1 { flex: 1; margin: 0; display: flex; align-items: center; font: 500 64px/1.12 "IBM Plex Sans", "Segoe UI", sans-serif;
  letter-spacing: -.01em; }
.foot { font: 500 22px/1.3 "IBM Plex Mono", Consolas, monospace; letter-spacing: .06em; text-transform: uppercase;
  color: #1f5fad; }
</style>
</head>
<body>
<div class="card">
  <div class="mast">
    <svg width="72" height="72" viewBox="0 0 28 28" aria-hidden="true"><rect x=".5" y=".5" width="27" height="27" rx="6" fill="#141a23"/><path d="M5 17H9L10.6 10L12.4 20L14.2 12.5L15.8 17H23" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span>Noisefloor<small>The Intelligence Company</small></span>
  </div>
  <h1>A daily, open picture of interference with satellite navigation and communications.</h1>
  <div class="foot">GPS loss · Spoofing · Ships at sea · Sun outages</div>
</div>
</body>
</html>
